name: docs check

# Docs are edited here by PRs; data is pushed to main nightly. Runs on both, so the docs and the
# published data can't drift apart unnoticed. See .github/scripts/check_docs.py for the checks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_docs.py
